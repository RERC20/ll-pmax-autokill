name: PMax Auto-Kill (8-min cadence)

# Runs kill_engine_google_auto.py on GitHub's servers (no laptop/VM needed).
# Drafts losing products, sends a Telegram message every run + a Resend email digest every 12h.
#
# CADENCE (owner 2026-10-02, ladder v7): EVERY 8-min tick of the external cron (cron-job.org) runs the
# engine. History: 2026-07-29 a 15-min gate halved Google Ads API ops while item-id node writes were
# exhausting the Basic Access 15k/day quota; v7 routes by label, and a full dry run measured 12 Google
# searches per run (~2,200/day at 8 min). The gate below only stops a doubled tick (< 200 s).
# To change cadence, edit GATE_S.
#
# PRIVACY: this repo is PUBLIC only so Actions minutes are free & unlimited. The CODE is public;
# your API creds are NOT -- they live in encrypted repo Secrets (never in the code, masked in logs,
# never handed to forks). Run logs (product ids + spend/revenue) are kept OUT of the repo and
# persisted privately via Actions cache, so nothing business-sensitive is ever committed publicly.

on:
  # Fires ONLY via workflow_dispatch — an external cron (cron-job.org) hits the dispatch API every
  # 8 min, which fires reliably. GitHub's own `schedule` was REMOVED: it's best-effort and dropped
  # ~70% of runs, and keeping it would double-fire alongside the external trigger.
  workflow_dispatch: {}

permissions:
  contents: read                 # read-only -- we no longer commit anything back to the repo
  actions: write                 # TEMP (owner 2026-08-10): lets the one-shot bridge step below
                                 # dispatch structure-edits.yml; remove with the bridge after it fires

concurrency:
  group: auto-kill               # one run at a time; a new 8-min trigger SUPERSEDES a stuck/queued
  cancel-in-progress: false      # v7.4 (2026-10-02): the */8 cron's :00 tick comes 4 min after :56 - it must not cancel a
                                 # slow :56 run part-way (lost sections + Telegram). GitHub keeps one run going and only the
                                 # newest one waiting, so nothing piles up; the 7-min job timeout still stops a hung run.

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 7           # (v7.3: 6 -> 7, still under the 8-min tick) a hung execution fails fast so the next run isn't delayed
                                 # (normal run is ~20-40s; GitHub runner-queue waits are separate)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Restore the rolling kills history (used by the 12h email digest) + the cadence
      # timestamp from a PRIVATE Actions cache -- not committed, not web-visible.
      - name: Restore kills history
        uses: actions/cache/restore@v4
        with:
          path: |
            kills_log_auto.csv
            winner_kills_log.csv
            _last_run_epoch.txt
            _structure_edits_fired.txt
          key: kills-log-${{ github.run_id }}
          restore-keys: |
            kills-log-

      # ONE-SHOT BRIDGE (owner 2026-08-09): GitHub's own `schedule` is best-effort, so the
      # external 8-min cron that fires THIS workflow also triggers the structure-edits
      # workflow ONCE, at the first tick on/after 23:10 UTC Aug 9 (= 00:10 UK Aug 10).
      # The cached marker guarantees once-only; the window closes Aug 12 (the script has
      # its own date guard + idempotence as second/third nets). DELETE this step, the
      # `actions: write` permission above and the marker cache line after it fires.
      - name: One-shot bridge -> structure edits (00:10 UK Aug-10)
        run: |
          if [ -f _structure_edits_fired.txt ]; then echo "bridge: already fired"; exit 0; fi
          target=$(date -u -d '2026-08-09 23:10:00' +%s)
          expiry=$(date -u -d '2026-08-12 00:00:00' +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ] || [ "$now" -gt "$expiry" ]; then
            echo "bridge: outside window (now $(date -u))"; exit 0
          fi
          echo "bridge: window open — dispatching structure-edits.yml"
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/structure-edits.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
          echo "fired $(date -u)" > _structure_edits_fired.txt

      # 8-MINUTE CADENCE GATE (owner 2026-10-02): every tick of the external cron proceeds unless the last engine run
      # was < 200s ago (a doubled tick). The cron is */8, i.e. minutes :00 :08 ... :56, so :56 -> :00 is only 4 min;
      # a 200 s gate keeps that :00 run too, so the engine runs at least every 8 minutes. The epoch is stamped BEFORE the engine runs, so even a
      # failed run counts as a tick (prevents retry-hammering Google during quota exhaustion).
      - name: Cadence gate (8 min)
        id: gate
        run: |
          GATE_S=200
          now=$(date +%s)
          last=$(cat _last_run_epoch.txt 2>/dev/null || echo 0)
          age=$((now - last))
          if [ "$age" -lt "$GATE_S" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tick skipped — last engine run ${age}s ago (< ${GATE_S}s gate)"
          else
            echo "$now" > _last_run_epoch.txt
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "gate open — last engine run ${age}s ago"
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run the auto-kill engine
        if: steps.gate.outputs.skip != 'true'
        env:
          GOOGLE_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_DEVELOPER_TOKEN }}
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:   ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CUSTOMER_ID:     ${{ secrets.GOOGLE_CUSTOMER_ID }}
          SHOPIFY_STORE:          ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID:      ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET:  ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO:               ${{ secrets.EMAIL_TO }}         # v7.7.1 (2026-10-06): the 12h digest + email alerts need it - the secret
                                                                 # existed since 12 Jul but was never passed, so no engine email was sent
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          PROVEN_BE_JSON:         ${{ secrets.PROVEN_BE_JSON }}   # ladder v7: own break-even per product (secret - public repo)
        run: python kill_engine_google_auto.py

      # Save the updated kills history + cadence timestamp back to the PRIVATE cache.
      - name: Save kills history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            kills_log_auto.csv
            winner_kills_log.csv
            _last_run_epoch.txt
            _structure_edits_fired.txt
          key: kills-log-${{ github.run_id }}
