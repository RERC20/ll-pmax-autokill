name: One-shot encrypted secrets export (Railway move)

# TEMPORARY (21 Oct 2026, owner-authorised): moving the engine to Railway. Encrypts the engine's secrets with a public
# key whose private key never leaves the owner's PC, and prints only ciphertext. Deleted right after one run.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt and print ciphertext only
        env:
          PUB_PEM: |
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA20j7TRcAhbY/uL1jY9MZ
            tbcBqiVtCAdESLbQPg+yAUeOcMS97GcQdzcq0T2uJs8YmHUDod2zyxFye0+VLNmm
            YFv/K2f9EmU6dCfnb1i4w5yxEY55bcJ5kZ4sJPPjv41eqIGJ0IYUw8sLp3QFq7lX
            rb1rcDZ8lQUeyDl9IKlhBc9kc1oB7HNvIapJBcbX3oSQcEozqnrV75ZIqoDagvNB
            WkVlb+IAkhlpoLZHk49VbeUJZMPtLZot1Ha21kSu/WcG0F20/6pBbNKlZEAtoH5k
            9RpvE7KUiLWqgJNtvVUmj9FpokNXFtaMTyQyqNWSNQh0FO4hEN1SD7Se8PHzxem4
            RDBqqpIs1Nd7TxtObelAJ45Fhrgnk9kE6tXuBAXyHfJvpyedbDL32w9gQq34fjqj
            WRqmPE4GggQGRqjiIlWNNVN0GdsjjDhPfSP8eGf5j23AHBitlPrLHscF+9vRh6jd
            Jc/bZp9np3sCsVMMHxK0FHgU7YfixhKLvs5iuiVgjN/hWpx11+p/B2Qut+F1DNft
            AVMVrZwV050VH5rGnm7msAbsFeiRYy5bhxRZ4avOlrwwNxZ2aS07OBH9d1pe2MMv
            vUXj9QtFKy+TfYd8z0Y01CUJFPCNI/oh0Hhn2kQ4VanJgm2JUdTWtXRuM8h7A7hp
            R+ixVA3/p2tUfqKMbgy+TtsCAwEAAQ==
            -----END PUBLIC KEY-----
          GOOGLE_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_DEVELOPER_TOKEN }}
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:   ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CUSTOMER_ID:     ${{ secrets.GOOGLE_CUSTOMER_ID }}
          SHOPIFY_STORE:          ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID:      ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET:  ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO:               ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          PROVEN_BE_JSON:         ${{ secrets.PROVEN_BE_JSON }}
        run: |
          pip install -q cryptography
          python3 - <<'PY'
          import os, json, base64
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          names = ['GOOGLE_DEVELOPER_TOKEN','GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','GOOGLE_REFRESH_TOKEN','GOOGLE_CUSTOMER_ID',
                   'SHOPIFY_STORE','SHOPIFY_CLIENT_ID','SHOPIFY_CLIENT_SECRET','RESEND_API_KEY','EMAIL_TO',
                   'TELEGRAM_BOT_TOKEN','TELEGRAM_CHAT_ID','PROVEN_BE_JSON']
          data = {n: os.environ[n] for n in names if os.environ.get(n)}
          print('present:', sorted(data), '| missing:', [n for n in names if n not in data])
          pub = serialization.load_pem_public_key(os.environ['PUB_PEM'].encode())
          key = AESGCM.generate_key(bit_length=256); nonce = os.urandom(12)
          ct = AESGCM(key).encrypt(nonce, json.dumps(data).encode(), None)
          wk = pub.encrypt(key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
          blob = base64.b64encode(json.dumps({'k': base64.b64encode(wk).decode(), 'n': base64.b64encode(nonce).decode(),
                                              'c': base64.b64encode(ct).decode()}).encode()).decode()
          for i in range(0, len(blob), 3000):
              print(f'ENC{i//3000:03d}:' + blob[i:i+3000])
          print('ENCEND', len(blob))
          PY
